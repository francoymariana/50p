    function buscarPoema() {
        const num = document.getElementById("numeroPoema").value;
        const res = document.getElementById("resultado");
        
        if (biblioteca[num]) {
            const p = biblioteca[num];
            res.innerHTML = `
                <div class="titulo-poema">${p.titulo}</div>
                <div class="cuerpo-poema">${p.texto}</div>
                <div class="autor-poema">${p.autor}</div>
            `;
        } else {
            res.innerHTML = "<p style='color: #ccc;'>Poema no encontrado. Elegí entre 1 y 50.</p>";
        }
    }
</script>
